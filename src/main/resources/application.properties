spring.application.name=ClinicPRO
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/ClinicPRO?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
# Disable SQL logging in production to reduce overhead (enable locally if needed)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HikariCP connection pool tuning (adjust values for your environment)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate tuning
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Enable HTTP compression to reduce response size and speed up network transfer
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

app.jwt.secret=clinicpro-dev-secret-key-clinicpro-dev-secret-key-clinicpro-dev-secret-key
app.jwt.expiration-ms=86400000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html