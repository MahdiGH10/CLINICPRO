spring.application.name=ClinicPRO
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/ClinicPRO?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=clinicpro-dev-secret-key-clinicpro-dev-secret-key-clinicpro-dev-secret-key
app.jwt.expiration-ms=86400000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html