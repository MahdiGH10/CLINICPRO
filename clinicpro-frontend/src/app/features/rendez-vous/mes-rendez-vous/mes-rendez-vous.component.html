<div class="page">
  <div class="page__header">
    <h2 class="page__title">Mes rendez-vous</h2>
    <button mat-flat-button color="primary" type="button" routerLink="/rendez-vous/nouveau">
      <i class="ti ti-plus" aria-hidden="true"></i>
      Nouveau rendez-vous
    </button>
  </div>

  @if (loading()) {
    <div class="page__loading">
      <mat-spinner diameter="40" />
    </div>
  } @else if (error()) {
    <p class="page__error">{{ error() }}</p>
  } @else {
    <div class="page__table-wrap">
      <table mat-table [dataSource]="dataSource" class="page__table">
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let row">{{ formatDate(row.date) }}</td>
        </ng-container>

        <ng-container matColumnDef="heure">
          <th mat-header-cell *matHeaderCellDef>Heure</th>
          <td mat-cell *matCellDef="let row">{{ row.heure || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="medecin">
          <th mat-header-cell *matHeaderCellDef>Médecin</th>
          <td mat-cell *matCellDef="let row">Dr. {{ row.medecin?.nom || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="motif">
          <th mat-header-cell *matHeaderCellDef>Motif</th>
          <td mat-cell *matCellDef="let row">{{ row.motif || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="statut">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let row">
            <app-rdv-status-badge [statut]="row.statut" />
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell page__empty" [attr.colspan]="columns.length">
            Vous n'avez pas encore de rendez-vous.
          </td>
        </tr>
      </table>
    </div>
  }
</div>
