<div class="page">
  <div class="page__header">
    <mat-form-field class="page__search" appearance="outline" subscriptSizing="dynamic">
      <mat-label>Rechercher par nom</mat-label>
      <input matInput [formControl]="searchControl" placeholder="Nom du patient" />
      <i matPrefix class="ti ti-search page__search-icon" aria-hidden="true"></i>
    </mat-form-field>

    @if (isAdmin()) {
      <button mat-flat-button color="primary" type="button" routerLink="/patients/nouveau">
        <i class="ti ti-plus" aria-hidden="true"></i>
        Nouveau patient
      </button>
    }
  </div>

  @if (loading()) {
    <div class="page__loading">
      <mat-spinner diameter="40" />
    </div>
  } @else if (error()) {
    <p class="page__error">{{ error() }}</p>
  } @else {
    <div class="page__table-wrap">
      <table mat-table [dataSource]="dataSource" class="page__table">
        <ng-container matColumnDef="nom">
          <th mat-header-cell *matHeaderCellDef>Nom</th>
          <td mat-cell *matCellDef="let row">{{ row.nom }}</td>
        </ng-container>

        <ng-container matColumnDef="tel">
          <th mat-header-cell *matHeaderCellDef>Téléphone</th>
          <td mat-cell *matCellDef="let row">{{ row.tel }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let row">{{ row.email || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="dateNaissance">
          <th mat-header-cell *matHeaderCellDef>Date de naissance</th>
          <td mat-cell *matCellDef="let row">{{ formatDate(row.dateNaissance) }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="page__actions-header">Actions</th>
          <td mat-cell *matCellDef="let row" class="page__actions-cell">
            <button
              mat-icon-button
              type="button"
              aria-label="Voir le profil"
              [routerLink]="['/patients', row.idPatient, 'profile']"
            >
              <i class="ti ti-eye" aria-hidden="true"></i>
            </button>
            <button
              mat-icon-button
              type="button"
              aria-label="Modifier"
              [routerLink]="['/patients', row.idPatient, 'edit']"
            >
              <i class="ti ti-pencil" aria-hidden="true"></i>
            </button>
            <button
              mat-icon-button
              type="button"
              color="warn"
              aria-label="Supprimer"
              (click)="deletePatient(row)"
            >
              <i class="ti ti-trash" aria-hidden="true"></i>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell page__empty" [attr.colspan]="displayedColumns.length">
            Aucun patient trouvé
          </td>
        </tr>
      </table>
    </div>
  }
</div>
