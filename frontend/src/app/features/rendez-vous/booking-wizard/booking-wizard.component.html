<div class="card">
  <h3 class="page-title">Booking Wizard</h3>
  <div *ngIf="step() === 1">
    <p>Step 1 — Select patient (autocomplete placeholder)</p>
    <button class="btn btn-primary" (click)="next()">Next</button>
  </div>
  <div *ngIf="step() === 2">
    <p>Step 2 — Select doctor</p>
    <button class="btn" (click)="prev()">Back</button>
    <button class="btn btn-primary" (click)="next()">Next</button>
  </div>
  <div *ngIf="step() === 3">
    <p>Step 3 — Pick slot</p>
    <button class="btn" (click)="prev()">Back</button>
    <button class="btn btn-primary">Confirm</button>
  </div>
</div>
