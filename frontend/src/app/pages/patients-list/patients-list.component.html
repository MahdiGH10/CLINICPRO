<div>
  <h2 class="page-title">Patients</h2>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="loading" class="loading">
    Loading patients...
  </div>

  <div *ngIf="!loading && patients.length === 0" class="card">
    <p>No patients found.</p>
  </div>

  <div *ngIf="!loading && patients.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let patient of patients" class="card">
      <h3 class="font-bold text-lg mb-2">{{ patient.nom }}</h3>
      <p><strong>Email:</strong> {{ patient.email || 'N/A' }}</p>
      <p><strong>Phone:</strong> {{ patient.tel || 'N/A' }}</p>
      <p><strong>DOB:</strong> {{ patient.dateNaissance || 'N/A' }}</p>
      <button class="btn btn-secondary mt-4">View Details</button>
    </div>
  </div>
</div>
