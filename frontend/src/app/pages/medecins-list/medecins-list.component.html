<div>
  <h2 class="page-title">Doctors</h2>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="loading" class="loading">
    Loading doctors...
  </div>

  <div *ngIf="!loading && medecins.length === 0" class="card">
    <p>No doctors found.</p>
  </div>

  <div *ngIf="!loading && medecins.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let medecin of medecins" class="card">
      <h3 class="font-bold text-lg mb-2">Dr. {{ medecin.nom }}</h3>
      <p><strong>Specialty:</strong> {{ medecin.specialite }}</p>
      <p><strong>Email:</strong> {{ medecin.email || 'N/A' }}</p>
      <p><strong>Availability:</strong> {{ medecin.disponibilite || 'N/A' }}</p>
      <button class="btn btn-secondary mt-4">Book Appointment</button>
    </div>
  </div>
</div>
