<div>
  <h2 class="page-title">Appointments</h2>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="loading" class="loading">
    Loading appointments...
  </div>

  <div *ngIf="!loading && appointments.length === 0" class="card">
    <p>No appointments found.</p>
  </div>

  <div *ngIf="!loading && appointments.length > 0" class="overflow-x-auto">
    <table class="min-w-full border-collapse">
      <thead class="bg-gray-100">
        <tr>
          <th class="border p-2 text-left">Date</th>
          <th class="border p-2 text-left">Time</th>
          <th class="border p-2 text-left">Doctor</th>
          <th class="border p-2 text-left">Patient</th>
          <th class="border p-2 text-left">Status</th>
          <th class="border p-2 text-left">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let apt of appointments" class="hover:bg-gray-50">
          <td class="border p-2">{{ apt.dateRendezVous }}</td>
          <td class="border p-2">{{ apt.heureRendezVous }}</td>
          <td class="border p-2">{{ apt.medecin?.nom || 'N/A' }}</td>
          <td class="border p-2">{{ apt.patient?.nom || 'N/A' }}</td>
          <td class="border p-2">
            <span class="px-2 py-1 rounded text-sm" [class]="apt.status === 'confirmed' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'">
              {{ apt.status || 'pending' }}
            </span>
          </td>
          <td class="border p-2">
            <button class="btn btn-secondary text-sm">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
